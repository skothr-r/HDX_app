# Conda environment for the HDX Filtering Streamlit app
# Install: conda env create -f environment_hdx_app.yml
# Activate: conda activate hdx_app
# Run: streamlit run hdx_filter_app.py
#
# Apple Silicon (M1/M2/M3): thermorawfileparser needs x86. Recreate env:
#   conda env remove -n hdx_app
#   CONDA_SUBDIR=osx-64 conda env create -f environment_hdx_app.yml
#   conda activate hdx_app && conda config --env --set subdir osx-64

name: hdx_app
channels:
  - conda-forge
  - bioconda
  - defaults
dependencies:
  - python>=3.10,<3.13
  - libjpeg-turbo  # Avoid Homebrew libjpeg conflict with PIL/libtiff on macOS
  - pyopenms
  - streamlit>=1.41.0
  - pandas>=1.5.0
  - numpy>=1.21.0
  - plotly>=5.0.0
  - matplotlib>=3.5.0
  - scipy
  - lxml
  - thermorawfileparser  # RAW to mzML conversion (Create tab); needs osx-64 on Apple Silicon
  - pip
  - pip:
      - pyhxexpress>=0.1.1
      - brain-isotopic-distribution
      - biopython
      - pyteomics
      - pymupdf